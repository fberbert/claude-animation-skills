<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(../template/web/fonts/Poppins-Bold.ttf)}
body{margin:0;background:#fff}</style></head><body>
<canvas id="c" width="1600" height="900"></canvas>
<script src="../template/web/lib.js"></script><script src="../template/web/chars.js"></script><script src="../template/web/personagem.js"></script>
<script>
// ficha do personagem: 5 poses lado a lado, para conferir o visual antes de usar num vídeo (tools/ficha.js tira a foto)
window.desenharFicha = (f, id) => {
  ELENCO[id] = f;
  const ctx = document.getElementById('c').getContext('2d');
  ctx.fillStyle = '#fbf7ef'; ctx.fillRect(0, 0, 1600, 900);
  ctx.fillStyle = '#efe7d8'; ctx.fillRect(0, 700, 1600, 200);
  text(ctx, f.nome || id, 800, 92, 72, INK, null, 0, 'Poppins', 700);
  const voz = f.voz ? Object.entries(f.voz).map(([k, v]) => `${k} ${v}`).join(' · ') : 'sem voz';
  text(ctx, [f.jeito, 'voz: ' + voz].filter(Boolean).join('  |  '), 800, 150, 28, '#6a6070', null, 0, 'Poppins', 700);
  const poses = [
    ['parado', {}],
    ['falando', { face: { mouth: 'grin', browUp: .5 }, arms: { L: [.3, -.1], R: [1.6, -1.2] } }],
    ['feliz', { face: { eyes: 'happy', mouth: 'grin' }, arms: { L: [2.5, .3], R: [2.5, .3] } }],
    ['surpreso', { face: { eyes: 'wide', mouth: 'o', browUp: 1, blink: 0 }, arms: { L: [.9, -2.2], R: [.9, -2.2] } }],
    ['de lado', { flip: -1, face: { turn: .7, look: [.6, 0] }, headTilt: -.05 }],
  ];
  poses.forEach(([nome, o], i) => {
    const x = 180 + i * 310;
    personagem(ctx, id, Object.assign({ x, y: 740, s: 500 }, o));
    text(ctx, nome, x, 800, 30, '#6a6070', null, 0, 'Poppins', 700);
  });
};
</script>
</body></html>
